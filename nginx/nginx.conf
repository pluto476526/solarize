user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # ------------------------------------------------------------------
    # Real-IP handling for Cloudflare + Docker internal traffic
    # ------------------------------------------------------------------
    # Cloudflare IPs (as of Nov 2025)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # Also trust Docker bridge network
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 127.0.0.1;

    real_ip_header    CF-Connecting-IP;   # Cloudflare
    real_ip_recursive on;

    # ------------------------------------------------------------------
    # Upstream
    # ------------------------------------------------------------------
    upstream solarize {
        server app:8000;
    }

    # ------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name milky-way.space www.milky-way.space;

        return 301 https://$host$request_uri;
    }

    # ------------------------------------------------------------------
    # Main HTTPS server
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name milky-way.space www.milky-way.space;

        # Let’s Encrypt certificates
        ssl_certificate     /etc/letsencrypt/live/milky-way.space/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/milky-way.space/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # HTTP/2 is enabled automatically on SSL in modern nginx
        # (no need for deprecated "http2" on the listen line)

        # Static & media files
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
        }

        # WebSocket + ASGI proxy
        location / {
            proxy_pass         http://solarize;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Recommended for Daphne/Channels
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
