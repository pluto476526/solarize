services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solarize-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
      - /home/solarize/.local:size=100M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./:/app:ro
      - ./var/www/media:/app/media
      - ./var/www/staticfiles:/app/staticfiles:ro

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: solarize-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./var/www/media:/app/media:ro
      - ./var/www/staticfiles:/app/staticfiles:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,size=50M
      - /var/run:uid=101,gid=101,size=10M
    networks:
      - webnet

networks:
  webnet:
    driver: bridge