## nginx/nginx.conf

user              nginx;
worker_processes  auto;
error_log         /var/log/nginx/error.log warn;
pid               /var/run/nginx.pid;

events {
    # Maximum simultaneous connections per worker
    worker_connections  1024;
}

http {
    # Load MIME types
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Optimize file transfer
    sendfile            on;
    keepalive_timeout   65;

    # ------------------------------
    # Real IP Handling (Cloudflare + Docker)
    # ------------------------------
    # Trust Cloudflare IP ranges for X-Real-IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # Trust internal Docker and localhost IPs
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 127.0.0.1;

    # Use Cloudflare connecting IP header
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;

    # ------------------------------
    # Rate limiting
    # ------------------------------
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5r/s;   # 5 requests/sec per IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;               # Max 10 concurrent connections per IP

    # ------------------------------
    # Upstream Django app
    # ------------------------------
    upstream solarize {
        server app:8000;  # container name and port
    }

    # ------------------------------
    # HTTP → HTTPS redirect
    # ------------------------------
    server {
        listen 80;
        server_name milky-way.space;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    # ------------------------------
    # Main HTTPS server
    # ------------------------------
    server {
        listen 443 ssl;
        server_name milky-way.space;

        # SSL certificates
        ssl_certificate     /etc/letsencrypt/live/milky-way.space/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/milky-way.space/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;


        # Limit connections per IP
        limit_conn addr 10;

        # Rate limiting
        limit_req zone=mylimit burst=10 nodelay;

        # ------------------------------
        # Static files served directly by Nginx
        # ------------------------------
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ------------------------------
        # Media files
        # ------------------------------
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ------------------------------
        # WebSocket + ASGI proxy to Django
        # ------------------------------
        location / {
            proxy_pass         http://solarize;
            proxy_http_version 1.1;

            # Preserve original host and client IP
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket headers
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Disable buffering for WebSocket/real-time requests
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    # ------------------------------
    # Default server to catch invalid hosts
    # ------------------------------
    server {
        listen 80 default_server;
        return 444;
    }

}
