server {
    listen 80;
    server_name milky-way.space www.milky-way.space;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name milky-way.space www.milky-way.space;

    ssl_certificate /etc/letsencrypt/live/milky-way.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milky-way.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cloudflare IP ranges
    set_real_ip_from 173.245.48.0/20
    set_real_ip_from 103.21.244.0/22
    set_real_ip_from 103.22.200.0/22
    set_real_ip_from 103.31.4.0/22
    set_real_ip_from 141.101.64.0/18
    set_real_ip_from 108.162.192.0/18
    set_real_ip_from 190.93.240.0/20
    set_real_ip_from 188.114.96.0/20
    set_real_ip_from 197.234.240.0/22
    set_real_ip_from 198.41.128.0/17
    set_real_ip_from 162.158.0.0/15
    set_real_ip_from 104.16.0.0/13
    set_real_ip_from 104.24.0.0/14
    set_real_ip_from 172.64.0.0/13
    set_real_ip_from 131.0.72.0/22

    real_ip_header CF-Connecting-IP;

    # Serve static files
    location /static/ {
        alias /var/www/solarize/staticfiles/;
        expires 30d;
    }

    # Serve media files
    location /media/ {
        alias /var/www/solarize/media/;
    }

    # Proxy pass to Daphne container
    location / {
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://app:8000;  # container name
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

