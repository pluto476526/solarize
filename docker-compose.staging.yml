services:
  db:
    image: timescale/timescaledb:latest-pg18
    container_name: solarize-db-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: solarize_staging
      POSTGRES_USER: pluto
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    tmpfs:
      - /var/lib/postgresql/tmp:size=100M
    security_opt:
      - no-new-privileges:true
    networks:
      - webnet_staging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solarize-app-staging
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - static_volume_staging:/app/staticfiles
      - ./var/www/media_staging:/app/media
    networks:
      - webnet_staging

  redis:
    image: redis:7-alpine
    container_name: solarize-redis-staging
    restart: unless-stopped
    networks:
      - webnet_staging

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solarize-celery-staging
    command: celery -A data_factory.celery:app worker --loglevel=info
    networks:
      - webnet_staging

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solarize-celery-beat-staging
    command: celery -A data_factory.celery:app beat --loglevel=info
    networks:
      - webnet_staging

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: solarize-nginx-staging
    restart: unless-stopped
    ports:
      - "8080:80"    # staging HTTP
      - "8443:443"   # staging HTTPS
    volumes:
      - static_volume_staging:/app/staticfiles:ro
      - ./var/www/media_staging:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,size=50M
      - /var/run:uid=101,gid=101,size=10M
    networks:
      - webnet_staging

volumes:
  static_volume_staging:
  postgres_data_staging:
    driver: local

networks:
  webnet_staging:
    driver: bridge

