services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solarize-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    read_only: true                      # Keep root filesystem read-only
    tmpfs:
      - /tmp
      - /home/solarize/.local:size=100M   # Required for --user pip installs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./:/app:ro                        # Source code (read-only)
      - ./var/www/media:/app/media        # User uploads
      - ./var/www/staticfiles:/app/staticfiles:ro

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: solarize-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./var/www/media:/app/media:ro
      - ./var/www/staticfiles:/app/staticfiles:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - webnet

networks:
  webnet:
    driver: bridge