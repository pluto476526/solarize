server {
    listen 80;
    server_name milky-way.space www.milky-way.space;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name milky-way.space www.milky-way.space;

    ssl_certificate /etc/letsencrypt/live/milky-way.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milky-way.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cloudflare IP ranges (example, add full list)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    real_ip_header CF-Connecting-IP;

    # Serve static files
    location /static/ {
        alias /var/www/solarize/staticfiles/;
        expires 30d;
    }

    # Serve media files
    location /media/ {
        alias /var/www/solarize/media/;
    }

    # Proxy pass to Daphne container
    location / {
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://app:8000;  # container name
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

