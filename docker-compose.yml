services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solarize-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
      - /home/solarize/.local:size=100M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./:/app:ro
      - ./var/www/media:/app/media
      - ./var/www/staticfiles:/app/staticfiles:ro

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: solarize-nginx
    restart: unless-stopped
    user: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./var/www/media:/app/media:ro
      - ./var/www/staticfiles:/app/staticfiles:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,size=50M
      - /var/run:uid=101,gid=101,size=10M
    networks:
      - webnet

  db:
    image: postgres:17-alpine
    container_name: solarize-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: solarize
      POSTGRES_USER: solarize
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups          # optional: easy pg_dump access
    tmpfs:
      - /var/lib/postgresql/tmp:size=100M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarize -d solarize"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - webnet

volumes:
  postgres_data:
    driver: local

networks:
  webnet:
    driver: bridge